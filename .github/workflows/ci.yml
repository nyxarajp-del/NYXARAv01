name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + reasoning + server extras)
        # torch / anthropic / openai are intentionally omitted — those tests skip
        # gracefully, keeping CI fast. httpx backs FastAPI's TestClient.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reasoning,server]" "httpx>=0.27"

      - name: Run tests
        # Hermetic by construction: no provider API keys are set in CI, so the LLM
        # faculty falls back to the offline mock and never reaches the network.
        run: pytest -q
