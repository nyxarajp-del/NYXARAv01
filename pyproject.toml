[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxara"
version = "0.1.0"
description = "NYXARA — sovereign cognitive architecture. Owner: Jaypal Khoja (JP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaypal Khoja", email = "nyxarajp@gmail.com" }]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[project.scripts]
nyxara = "nyxara.__main__:main"
nyxara-serve = "nyxara.server.__main__:main"

[project.optional-dependencies]
# Reasoning / math / data
reasoning = ["z3-solver>=4.12", "sympy>=1.12", "numpy>=1.26", "networkx>=3.2", "scikit-learn>=1.4"]
# LLM providers (Groq is OpenAI-wire-compatible, driven via the openai SDK)
llm = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27"]
# Qwen3 local open-source model — downloaded & run in-process via HuggingFace.
# Qwen3 chat templates need transformers>=4.51; accelerate enables device_map="auto".
qwen = ["transformers>=4.51", "torch>=2.2", "accelerate>=0.30"]
# Vector / retrieval (scale: faiss ANN index, selected via NYXARA_MEMORY__VECTOR_BACKEND=faiss)
vector = ["faiss-cpu>=1.8", "numpy>=1.26"]
# Learned semantic embeddings (NYXARA_MEMORY__SEMANTIC_EMBEDDINGS=true)
embeddings = ["sentence-transformers>=2.7"]
# Generative output — images (diffusion) & speech (offline TTS). Both degrade to a real,
# dependency-free fallback (identicon PNG / tone-signature WAV) when absent.
generate = ["diffusers>=0.27", "torch>=2.2", "pyttsx3>=2.90"]
# Security
security = ["cryptography>=42.0"]
# Observability
observe = ["structlog>=24.1"]
# HTTP/WebSocket API server (reach NYXARA from an app/phone/web, not only the console)
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Senses (heavy ML — optional, graceful fallback when absent)
senses = [
    "torch>=2.2", "openai-whisper>=20231117", "pillow>=10.0",
    "opencv-python>=4.9", "pdfplumber>=0.11", "python-docx>=1.1", "openpyxl>=3.1",
]
# Self-built-model foundry (heavy ML — optional; the n-gram backend works without these)
foundry = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "datasets>=2.18", "tokenizers>=0.15"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nyxara*"]
