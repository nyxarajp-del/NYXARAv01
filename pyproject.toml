[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxara"
version = "0.1.0"
description = "NYXARA — sovereign cognitive architecture. Owner: Jaypal Khoja (JP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaypal Khoja", email = "nyxarajp@gmail.com" }]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[project.scripts]
nyxara = "nyxara.__main__:main"
nyxara-serve = "nyxara.server.__main__:main"
nyxara-daemon = "nyxara.daemon:main"
nyxara-grow = "nyxara.growth.__main__:main"
nyxara-improve = "nyxara.growth.improve_main:main"
nyxara-genesis = "nyxara.growth.genesis_main:main"
nyxara-self-optimize = "nyxara.growth.self_optimize_main:main"
nyxara-prove = "nyxara.growth.prove_main:main"

[project.optional-dependencies]
# Her PRIMARY brain: Gemma-4-E2B-it served ON-DEVICE by Google's LiteRT-LM runtime (import name
# `litert_lm`). Wheels exist for linux/macos/windows x86-64 and arm64. This installs the runtime
# only — fetch the ~2.4 GB weights once with `python scripts/fetch_litertlm_model.py`, or just boot
# her and let growth/bootstrap.py do it. Without either, mind/llm.py reports the rung honestly
# unavailable and the auto ladder starts at the cloud instead.
# No system packages needed: the runtime links the Vulkan loader even on CPU, and
# mind/vulkan_shim.py generates a stub that satisfies it. `apt install libvulkan1` only if
# you want the real loader (required for the gpu/npu backends, where the stub declines).
litertlm = ["litert-lm-api>=0.15.0"]
# Reasoning / math / data
reasoning = ["z3-solver>=4.12", "sympy>=1.12", "numpy>=1.26", "networkx>=3.2", "scikit-learn>=1.4"]
# LLM — DistilGPT-2, downloaded & run in-process via HuggingFace (no API keys).
# accelerate enables device_map="auto"; httpx stays for web senses.
llm = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30", "httpx>=0.27"]
# Alias for the same local stack (kept as an obvious install target for the provider).
distilgpt2 = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
# Deprecated aliases for `distilgpt2` (the provider key is still `qwen` internally).
tinyllama = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
qwen = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
# Vector / retrieval (scale: faiss ANN index, selected via NYXARA_MEMORY__VECTOR_BACKEND=faiss)
vector = ["faiss-cpu>=1.8", "numpy>=1.26"]
# Managed/embedded Qdrant vector DB (NYXARA_MEMORY__VECTOR_BACKEND=qdrant). Embedded
# local/in-memory out of the box; point qdrant_url at a cluster for real scale.
qdrant = ["qdrant-client>=1.7"]
# Learned semantic embeddings (NYXARA_MEMORY__SEMANTIC_EMBEDDINGS=true)
embeddings = ["sentence-transformers>=2.7"]
# Generative output — images (diffusion) & speech (offline TTS). Both degrade to a real,
# dependency-free fallback (identicon PNG / tone-signature WAV) when absent.
generate = ["diffusers>=0.27", "torch>=2.2", "pyttsx3>=2.90"]
# Security
security = ["cryptography>=42.0"]
# Remote execution — SSH login + remote commands on external hosts (agency/remote_exec.py).
# Import-guarded: without it the remote tools return an install hint as data instead of running.
remote = ["paramiko>=3.4"]
# Observability
observe = ["structlog>=24.1"]
# HTTP/WebSocket API server (reach NYXARA from an app/phone/web, not only the console)
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Senses (heavy ML — optional, graceful fallback when absent)
senses = [
    "torch>=2.2", "openai-whisper>=20231117", "soundfile>=0.12", "pillow>=10.0",
    "opencv-python>=4.9", "pytesseract>=0.3.10", "pdfplumber>=0.11", "python-docx>=1.1",
    "openpyxl>=3.1", "mss>=9.0", "sounddevice>=0.4", "psutil>=5.9",
]
# OCR additionally needs the system `tesseract` binary (e.g. `apt-get install tesseract-ocr`).
# Self-built-model foundry (heavy ML — optional; the n-gram backend works without these)
foundry = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "datasets>=2.18", "tokenizers>=0.15"]
# QLoRA — foundry + 4-bit quantized base load (bitsandbytes needs a CUDA box to be used;
# installing it elsewhere is harmless, the forge just trains full-precision LoRA instead).
qlora = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "datasets>=2.18", "tokenizers>=0.15",
         "bitsandbytes>=0.43"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# A per-test ceiling, because the suite had no ceiling at all. CI's `Run tests` step was
# CANCELLED at 2h40m and 4h55m on consecutive main runs — no failure, no traceback, nothing to
# act on, and the whole Actions allowance spent on a job that never reported. A test that
# overruns this now fails in five minutes with a stack pointing at where it hung.
#
# `thread` rather than the default `signal`: much of what hangs here is inside a worker thread
# (the parallel reasoning framings), and a SIGALRM handler only ever fires on the main one.
addopts = "-q --timeout=300 --timeout-method=thread"

[tool.ruff]
# Match the codebase's prevailing style; correctness rules over cosmetics.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) plus the correctness-shaped pycodestyle subset (E4/E7/E9) catches the bugs that
# matter — undefined names, unused imports, redefinitions — without churning the existing,
# deliberate style.
#
# SELECTED EXPLICITLY, and that is the point. This used to rely on ruff's *implicit* default set,
# which was exactly this list until ruff 0.16 broadened it to include pyupgrade, bandit, isort,
# flake8-comprehensions and more. Because the dev extra floats (`ruff>=0.6`), CI installed 0.16 the
# day it shipped and the lint step went from clean to 14,936 findings across a codebase that had
# never opted into those rules — red on every branch and on main since. Naming the set here pins the
# intent to the config instead of to whatever ruff happens to consider default this month.
#
# Widening this is a deliberate decision, not an upgrade side-effect: add the rule, fix the fallout,
# same commit.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # imports after code: NYXARA guards heavy/optional deps behind runtime checks
    "E741",  # ambiguous names (l/I/O): used deliberately in a few math/loop contexts
    "E731",  # lambda assignment: a couple of terse, intentional one-liners
    "E702",  # multiple statements on a line (semicolons): used in compact test setups
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files curate the public API by re-exporting names — those imports
# look "unused" to the linter but are the package's surface.
"__init__.py" = ["F401"]
# Tests occasionally bind throwaway locals for clarity; that's fine in fixtures.
"tests/*" = ["F841"]

[tool.setuptools.packages.find]
include = ["nyxara*"]

[tool.setuptools.package-data]
# Ship the curated real-world held-out validation corpus (eval/datasets.py loads it via
# importlib.resources) so external validation works from an installed wheel, not only the repo.
"nyxara.eval" = ["data/*.jsonl"]
