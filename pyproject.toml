[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxara"
version = "0.1.0"
description = "NYXARA — sovereign cognitive architecture. Owner: Jaypal Khoja (JP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jaypal Khoja", email = "nyxarajp@gmail.com" }]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
# Reasoning / math / data
reasoning = ["z3-solver>=4.12", "sympy>=1.12", "numpy>=1.26", "networkx>=3.2", "scikit-learn>=1.4"]
# LLM providers
llm = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27"]
# Vector / retrieval
vector = ["faiss-cpu>=1.8"]
# Security
security = ["cryptography>=42.0"]
# Observability
observe = ["structlog>=24.1"]
# Senses (heavy ML — optional, graceful fallback when absent)
senses = [
    "torch>=2.2", "openai-whisper>=20231117", "pillow>=10.0",
    "opencv-python>=4.9", "pdfplumber>=0.11", "python-docx>=1.1", "openpyxl>=3.1",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["nyxara*"]
